<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Quality Audit & BI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body>

<div class="header-dhl">
    <div class="logo">DHL <span>Supply Chain Quality Analytics</span></div>
</div>

<div class="kpi-container">
    <div class="kpi-card">
        <span class="kpi-title">CALIDAD OPERATIVA</span>
        <span id="globalPerc" class="kpi-value">--%</span>
    </div>
    <div class="kpi-card">
        <span class="kpi-title">TOTAL PALETS</span>
        <span id="globalTotal" class="kpi-value">0</span>
    </div>
    <div class="kpi-card">
        <span class="kpi-title">INCIDENCIAS</span>
        <span id="globalErrors" class="kpi-value">0</span>
    </div>
</div>

<div class="container">
    <div class="dashboard-grid">
        
        <aside class="card">
            <h3>📝 Nueva Auditoría</h3>
            <div class="form-group">
                <label>Nombre del Operario:</label>
                <input type="text" id="cargador" placeholder="Operario responsable">
            </div>
            <div class="form-group">
                <label>Referencia Camión / Albarán:</label>
                <input type="text" id="referencia" placeholder="Matrícula o ID">
            </div>
            <div class="form-group">
                <label>Total Palets Camión:</label>
                <input type="number" id="totalBuenos" value="33">
            </div>
            <div class="form-group">
                <label>Cantidad de Errores:</label>
                <input type="number" id="cantidadError" value="0">
            </div>
            <div class="form-group">
                <label>Causa de la Incidencia:</label>
                <select id="tipoError">
                    <option value="Ninguno">✅ Carga Correcta</option>
                    <option value="No Facturado">⚠️ No Facturado</option>
                    <option value="Dañado">📦 Mercancía Dañada</option>
                    <option value="Extraviado">❌ Palé Perdido</option>
                    <option value="Sobrante">➕ Palé de Más</option>
                </select>
            </div>
            <div class="form-group">
                <label>Observaciones Técnicas:</label>
                <textarea id="comentario" rows="3" placeholder="Detallar motivo del error..."></textarea>
            </div>
            <button id="btnGuardar" class="btn-main">💾 GRABAR AUDITORÍA</button>
        </aside>

        <main>
            <div class="card chart-container">
                <h3>📊 Tendencia de Errores por Día</h3>
                <canvas id="erroresChart"></canvas>
            </div>

            <div class="ranking-section card">
                <div class="header-ranking">
                    <h3>🏆 Ranking de Excelencia</h3>
                    <button id="btnReset" class="btn-reset">🔄 RESET MES</button>
                </div>
                <div id="rankingList" class="ranking-container"></div>
            </div>

            <div class="card">
                <div class="header-ranking">
                    <h3>📋 Historial de Trazabilidad</h3>
                    <button id="btnExportar" class="btn-excel">📗 EXCEL PARA GERENCIA</button>
                </div>
                <div class="table-wrapper">
                    <table id="tablaAuditoria">
                        <thead>
                            <tr>
                                <th>FECHA</th>
                                <th>ID ERR</th>
                                <th>OPERARIO</th>
                                <th>REF.</th>
                                <th>ERR</th>
                                <th>OBSERVACIONES</th>
                                <th>ACCION</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
