<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DHL Quality Audit System v9.0</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body>

<div class="header-dhl">
    <div class="logo">DHL <span>Supply Chain Quality Analytics</span></div>
</div>

<div class="search-container no-print">
    <input type="text" id="filtroNombre" placeholder="🔍 Filtrar operario para actualizar KPIs, Gráficos e Historial...">
</div>

<div class="kpi-container">
    <div class="kpi-card">
        <span class="kpi-title">CALIDAD FILTRADA</span>
        <span id="globalPerc" class="kpi-value">--%</span>
    </div>
    <div class="kpi-card">
        <span class="kpi-title">PALETS ANALIZADOS</span>
        <span id="globalTotal" class="kpi-value">0</span>
    </div>
    <div class="kpi-card">
        <span class="kpi-title">ERRORES DETECTADOS</span>
        <span id="globalErrors" class="kpi-value">0</span>
    </div>
</div>

<div class="container">
    <div class="dashboard-grid">
        
        <aside class="card no-print">
            <h3>📝 Nueva Auditoría</h3>
            <div class="form-group">
                <label>Operario Responsable:</label>
                <input type="text" id="cargador" placeholder="Nombre completo">
            </div>
            <div class="form-group">
                <label>Referencia Camión / Albarán:</label>
                <input type="text" id="referencia" placeholder="Ej: Volvo-4422">
            </div>
            <div class="form-group">
                <label>Total Palets Camión:</label>
                <input type="number" id="totalBuenos" value="33">
            </div>
            <div class="form-group">
                <label>Cantidad de Errores:</label>
                <input type="number" id="cantidadError" value="0">
            </div>
            <div class="form-group">
                <label>Causa de la Incidencia:</label>
                <select id="tipoError">
                    <option value="Ninguno">✅ Carga Correcta</option>
                    <option value="No Facturado">⚠️ No Facturado</option>
                    <option value="Dañado">📦 Mercancía Dañada</option>
                    <option value="Extraviado">❌ Palé Perdido</option>
                    <option value="Sobrante">➕ Palé de Más</option>
                </select>
            </div>
            <div class="form-group">
                <label>Observaciones Técnicas:</label>
                <textarea id="comentario" rows="2" placeholder="Detalles del error..."></textarea>
            </div>
            <button id="btnGuardar" class="btn-main">💾 GUARDAR AUDITORÍA</button>
        </aside>

        <main id="main-content">
            <div class="card chart-container no-print">
                <h3 id="chartTitle">📊 Tendencia de Calidad Semanal</h3>
                <canvas id="erroresChart"></canvas>
            </div>

            <div class="ranking-section card">
                <div class="header-ranking">
                    <h3>🏆 Ranking de Excelencia</h3>
                    <button id="btnReset" class="btn-reset no-print">🔄 RESET MES</button>
                </div>
                <div id="rankingList" class="ranking-container"></div>
            </div>

            <div class="card">
                <div class="header-ranking">
                    <h3>📋 Historial Filtrado</h3>
                    <div class="actions-group">
                        <button id="btnPdf" class="btn-pdf no-print">📄 PDF</button>
                        <button id="btnExportar" class="btn-excel no-print">📗 EXCEL</button>
                    </div>
                </div>
                <div class="table-wrapper">
                    <table id="tablaAuditoria">
                        <thead>
                            <tr>
                                <th>FECHA</th>
                                <th>ID ERR</th>
                                <th>OPERARIO</th>
                                <th>ERR</th>
                                <th>OBSERVACIONES</th>
                                <th class="no-print">ACCION</th>
                            </tr>
                        </thead>
                        <tbody id="cuerpoTabla"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script type="module" src="script.js"></script>
</body>
</html>
